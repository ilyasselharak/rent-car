services:
  - type: web
    name: rentcar-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: cd ../.. && yarn install --frozen-lockfile && yarn prisma generate --schema=packages/database/prisma/schema.prisma && yarn turbo run build --filter=@rentcar/backend
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: rentcar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: rentcar-db
    plan: free
    databaseName: rentcar
