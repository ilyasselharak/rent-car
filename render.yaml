services:
  - type: web
    name: rentcar-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: cd ../.. && bash render-build.sh
    startCommand: cd ../.. && cd packages/database && node ../../node_modules/prisma/build/index.js migrate deploy && cd ../../apps/backend && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: rentcar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: rentcar-db
    plan: free
    databaseName: rentcar
